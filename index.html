    <script>
      // Prevent Vite HMR WebSocket from opening a dead connection in Cloud Run / preview environments
      // and suppress any WebSocket connection warnings before @vite/client initializes.
      (function () {
        function shouldSuppress(errOrMsg) {
          var s = String((errOrMsg && errOrMsg.message) || errOrMsg || '');
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('@vite/client') !== -1
          );
        }

        // Neutralize Vite HMR WebSocket constructor calls so @vite/client never throws
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var isViteWs =
              typeof protocols === 'string' && protocols.indexOf('vite-') === 0;
            var urlStr = String(url || '');
            if (isViteWs || urlStr.indexOf('token=') !== -1) {
              var dummy = {
                url: urlStr,
                readyState: 3,
                protocol: '',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () {
                  return true;
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          try {
            window.WebSocket = PatchedWebSocket;
          } catch (_e) {}
        }

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (shouldSuppress(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (e) {
            if (shouldSuppress(e.error || e.message)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        var origError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
